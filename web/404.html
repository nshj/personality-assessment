<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · MBTI 人格倾向评估</title>
<style>
:root{--bg:#fbfaf7;--ink:#1b1b19;--mut:#8a877e;--a1:#5b7c6f}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#ecebe6;--mut:#8f8c84;--a1:#8fb3a4}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);padding:32px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.box{max-width:430px;text-align:center}
.n{font-size:84px;font-weight:200;letter-spacing:-.04em;line-height:1;color:var(--a1);font-variant-numeric:tabular-nums}
h1{font-size:19px;font-weight:600;margin:22px 0 10px;letter-spacing:-.01em}
p{font-size:13.5px;line-height:1.8;color:var(--mut)}
a{display:inline-block;margin-top:26px;padding:11px 26px;border-radius:999px;background:var(--ink);color:var(--bg);
  text-decoration:none;font-size:13.5px;font-weight:600}
a:hover{opacity:.85}
</style>
</head>
<body>
<div class="box">
  <div class="n">404</div>
  <h1>这个地址上没有页面</h1>
  <p>可能是链接输错了，或者文件被移动过。<br>回到首页重新开始就可以。</p>
  <a href="/">回到首页</a>
</div>
</body>
</html>
